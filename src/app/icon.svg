<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The breath, at favicon scale: a filled core inside an expanded ring.
    The same idea as the hero's breathing field and the pacer, reduced to the
    two states it moves between. Solid shapes only — hairlines disappear at 16px.
  -->
  <rect width="32" height="32" rx="7" fill="#0f1420"/>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#93b8e8" stroke-width="1.75" opacity="0.55"/>
  <circle cx="16" cy="16" r="5" fill="#93b8e8"/>
</svg>
